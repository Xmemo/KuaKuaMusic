name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "arch/**"
      - "workflow/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run schemas:generate
      - run: git diff --exit-code -- schemas
      - run: npm run workflow:v4:dsp-selftest
      - run: npm run verify
